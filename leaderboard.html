<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaderboard | Territory Runner</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-base-200">
    <header class="border-b border-base-300 bg-base-100">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
        <h1 class="text-xl font-bold">Leaderboard</h1>

        <button
          type="button"
          class="btn btn-ghost btn-sm md:hidden"
          data-menu-toggle
          data-menu-target="mobileMenu"
          aria-controls="mobileMenu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <nav class="hidden md:flex">
          <a href="index.html" class="btn btn-sm btn-ghost">Back to Home</a>
        </nav>
      </div>

      <nav id="mobileMenu" class="mx-auto hidden max-w-6xl px-4 pb-4 md:hidden">
        <a href="index.html" class="btn btn-ghost btn-sm w-full">Back to Home</a>
      </nav>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-8">
      <section class="overflow-x-auto rounded-box bg-base-100 shadow-sm">
        <table class="table table-zebra">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Runner</th>
              <th>Score</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td>Alex</td>
              <td>980</td>
            </tr>
            <tr>
              <td>2</td>
              <td>Nafis</td>
              <td>930</td>
            </tr>
            <tr>
              <td>3</td>
              <td>Rima</td>
              <td>890</td>
            </tr>
            <tr>
              <td>4</td>
              <td>Tanvir</td>
              <td>860</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script src="js/main.js"></script>
  </body>
</html>
